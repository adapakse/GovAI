name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: gateway
            build_args: ""
          - service: api
            build_args: ""
          - service: frontend
            build_args: |
              NEXT_PUBLIC_API_URL=https://ci.invalid/api
              NEXT_PUBLIC_WS_URL=wss://ci.invalid/api
              NEXT_PUBLIC_GATEWAY_URL=https://ci.invalid/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: govai-${{ matrix.service }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Testy jednostkowe (gateway)
        if: matrix.service == 'gateway'
        run: docker run --rm govai-gateway:ci sh -c "pip install --quiet pytest && python -m pytest tests/ -q"
