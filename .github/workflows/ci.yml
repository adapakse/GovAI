name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  i18n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # intl-messageformat (z next-intl) potrzebny do kontroli składni ICU komunikatów frontendu
      - name: Zależności frontendu
        run: npm ci --prefix frontend --ignore-scripts

      - name: Kompletność tłumaczeń (10 języków)
        run: node scripts/i18n-check.mjs

  # Izolacja organizacji (multitenancy): pełny stos (Postgres + migracje + API +
  # gateway) i testy czarnoskrzynkowe z tests/isolation — dwie organizacje,
  # każdy endpoint krzyżowo, RLS, gateway, WebSocket.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Środowisko testowe (.env z losowymi sekretami)
        run: |
          {
            echo "DB_PASSWORD=ci$(openssl rand -hex 16)"
            echo "DB_APP_PASSWORD=ci$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "ANTHROPIC_API_KEY=sk-ant-ci-placeholder"
            echo "ALLOWED_ORIGINS=http://localhost"
            echo "TENANT_BASE_DOMAINS=govai.test"
          } > .env

      - name: Build api + gateway
        run: docker compose build api gateway

      - name: Postgres + migracje
        run: |
          docker compose up -d postgres redis
          # init.sql działa przy pierwszym starcie — czekamy, aż tabele istnieją
          timeout 120 sh -c 'until docker compose exec -T postgres psql -U govai -d govai -tAc "SELECT 1 FROM agents LIMIT 1" >/dev/null 2>&1; do sleep 2; done'
          sh infra/scripts/migrate.sh

      - name: Start api + gateway
        run: |
          docker compose up -d --no-deps api gateway
          for svc in api:8000 gateway:8001; do
            name=${svc%%:*}; port=${svc##*:}
            timeout 180 sh -c "until docker compose exec -T $name python -c \"import urllib.request; urllib.request.urlopen('http://localhost:$port/health')\" >/dev/null 2>&1; do sleep 3; done"
          done

      - name: Testy izolacji
        run: sh tests/isolation/run.sh

      - name: Logi przy błędzie
        if: failure()
        run: docker compose logs --tail 200 api gateway postgres

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: gateway
            build_args: ""
          - service: api
            build_args: ""
          - service: frontend
            build_args: |
              NEXT_PUBLIC_API_URL=https://ci.invalid/api
              NEXT_PUBLIC_WS_URL=wss://ci.invalid/api
              NEXT_PUBLIC_GATEWAY_URL=https://ci.invalid/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: govai-${{ matrix.service }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Testy jednostkowe (gateway)
        if: matrix.service == 'gateway'
        run: docker run --rm govai-gateway:ci sh -c "pip install --quiet pytest && python -m pytest tests/ -q"
