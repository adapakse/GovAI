# Landing (website/) na Cloudflare Pages — darmowy hosting statyczny zamiast VM / govai-edge.
# master → produkcja (govai.pl, www.govai.pl), develop → wdrożenie gałęzi "develop" (int.govai.pl).
# Wymaga sekretów repo: CLOUDFLARE_API_TOKEN (uprawnienie „Cloudflare Pages: Edit”) i CLOUDFLARE_ACCOUNT_ID
# oraz zmiennej repo LANDING_PAGES_ENABLED=true. Domeny podpina się raz w panelu Cloudflare
# (Pages → govai-landing → Custom domains): govai.pl, www.govai.pl (produkcja), int.govai.pl (gałąź develop).
name: Deploy landing (Cloudflare Pages)

on:
  push:
    branches: [master, develop]
    paths: ['website/**', '.github/workflows/deploy-landing.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-landing-${{ github.ref_name }}
  cancel-in-progress: true

env:
  PROJECT: govai-landing

jobs:
  deploy:
    if: vars.LANDING_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (podstawienie adresu strony)
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = master ]; then addr=govai.pl; else addr=int.govai.pl; fi   # sama domena, jak DOMAIN_NAME w edge
          rm -rf dist && cp -r website dist
          grep -rl '{{ADDRESS}}' dist | xargs -r sed -i "s|{{ADDRESS}}|$addr|g"
          if grep -rq '{{ADDRESS}}' dist; then echo "::error::Zostały niepodstawione {{ADDRESS}}"; exit 1; fi
          # INT nie jest indeksowany przez wyszukiwarki.
          if [ "$GITHUB_REF_NAME" != master ]; then printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt; fi

      - name: Projekt Pages (utworzenie przy pierwszym uruchomieniu)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project list | grep -q "$PROJECT" \
            || npx --yes wrangler@4 pages project create "$PROJECT" --production-branch master

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch "$GITHUB_REF_NAME" --commit-dirty=true
